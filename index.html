<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>JS Game</title>
</head>

<body>

    <div class="container">
        <div class="container__conteudo">
            <form class="container__informacoes" id="guess-form" novalidate>
                <div class="container__texto">     
                         
                    <h1>Jogo do número secreto</h1>
                    <p class="texto__paragrafo" id="status" role="status">Escolha um número de 1 a 10.</p>
                </div>
                <input id="guess" aria-label="Chute" aria-describedby="status" type="number" min="1" max="10" class="container__input">
                <div class="chute container__botoes">
                    <button type="submit" id="submit" class="container__botao">Chutar</button>
                    <button type="button" id="reiniciar" class="container__botao" disabled>Novo jogo</button>
                </div>
            </form>
            <img src="./img/ia.png" alt="Uma pessoa olhando para a esquerda" class="container__imagem-pessoa" />
        </div>
    </div>




    <script src="app.js" type="module"></script>
</body>

</html>
