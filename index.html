<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
        />
        <meta
            name="description"
            content="Adivinhe o número secreto com a ajuda das dicas."
        />
        <title>Jogo do número secreto</title>
        <link rel="stylesheet" href="./style.css" />
        <link rel="icon" href="./img/icon.svg" type="image/svg+xml" />
        <script type="module" src="./app.js"></script>
    </head>
    <body>
        <main class="game-card">
            <div class="game-content">
                <h1>Jogo do <span>número secreto</span></h1>
                <p id="range"></p>
                <noscript><p>Ative o JavaScript para jogar.</p></noscript>
                <form id="game" novalidate>
                    <label for="guess">Seu palpite</label>
                    <input
                        id="guess"
                        type="number"
                        inputmode="numeric"
                        step="1"
                        aria-describedby="range status"
                        required
                        disabled
                    />
                    <div class="actions">
                        <button id="submit" type="submit" disabled>
                            Chutar
                        </button>
                        <button id="restart" type="button" disabled>
                            Novo jogo
                        </button>
                    </div>
                    <p id="status" role="status" aria-atomic="true"></p>
                </form>
            </div>
            <picture>
                <source media="(min-width: 48rem)" srcset="./img/ia.webp" />
                <img src="./img/icon.svg" alt="" width="558" height="625" />
            </picture>
        </main>
    </body>
</html>
