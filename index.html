<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Jogo do número secreto</title>
</head>

<body>

    <main class="container">
        <div class="container__conteudo">
            <form class="container__informacoes" id="guess-form" novalidate>
                <div class="container__texto">     
                         
                    <h1>Jogo do número secreto</h1>
                    <p class="texto__paragrafo" id="status" role="status">Escolha um número de 1 a 10.</p>
                </div>
                <label for="difficulty">Dificuldade</label>
                <select id="difficulty" aria-describedby="difficulty-help">
                    <option value="10">Iniciante (1–10)</option>
                    <option value="25">Intermediário (1–25)</option>
                    <option value="50">Avançado (1–50)</option>
                </select>
                <p id="difficulty-help">Mudar a dificuldade inicia uma nova rodada.</p>
                <label for="guess">Seu palpite</label>
                <input id="guess" aria-describedby="status" type="number" inputmode="numeric" min="1" max="10" class="container__input">
                <div class="chute container__botoes">
                    <button type="submit" id="submit" class="container__botao">Chutar</button>
                    <button type="button" id="reiniciar" class="container__botao" disabled>Novo jogo</button>
                </div>
                <section id="guess-history" aria-labelledby="history-title" hidden>
                    <h2 id="history-title">Últimos palpites</h2>
                    <p id="range-hint"></p>
                    <ol id="recent-guesses"></ol>
                </section>
            </form>
            <img src="./img/ia.png" alt="" class="container__imagem-pessoa">
        </div>
    </main>




    <script src="app.js" type="module"></script>
</body>

</html>
